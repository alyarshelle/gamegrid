<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      const path = window.location.pathname;

      if (!path.startsWith("/gamegrid/")) {
        sessionStorage.redirect = location.href;

        location.replace(
          "/gamegrid" +
          path +
          window.location.search +
          window.location.hash
        );
      } else {
        sessionStorage.redirect = location.href;
      }
    </script>
  </head>
  <body></body>
</html>
